# Temporary preview environment. Free PostgreSQL expires after 30 days.
services:
  - type: web
    name: sweet-by-andre-staging
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Run on startup because Free services do not support pre-deploy commands.
    dockerCommand: node scripts/startStaging.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sweet-by-andre-staging-db
          property: connectionString
      - key: APP_ENV
        value: staging
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: CSRF_SECRET
        sync: false
      - key: STAGING_ADMIN_EMAIL
        value: sweetbyandre@gmail.com
      - key: STAGING_ADMIN_PASSWORD
        sync: false
      # Checkout defaults to false in Dockerfile. Configure the test switch in
      # Render Environment after adding the Stripe test key and signing secret.
      - key: ENABLE_TRANSACTIONAL_NOTIFICATIONS
        value: "false"
      - key: ENABLE_TRANSACTIONAL_SMS
        value: "false"

databases:
  - name: sweet-by-andre-staging-db
    plan: free
    region: virginia
    postgresMajorVersion: "18"
    ipAllowList: []
